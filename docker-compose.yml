# MySQL local para probar el perfil "mysql":   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: nutrivida-mysql
    environment:
      MYSQL_DATABASE: nutrivida
      MYSQL_USER: nutrivida
      MYSQL_PASSWORD: nutrivida
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - nutrivida-data:/var/lib/mysql
volumes:
  nutrivida-data:
