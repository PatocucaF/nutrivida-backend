spring.application.name=nutrivida

# Datasource
spring.datasource.url=jdbc:h2:mem:nutrivida;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:nutrivida-super-secret-key-change-it}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrador inicial 
app.admin.email=${ADMIN_EMAIL:admin@nutrivida.cl}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# CORS: URL(s) del frontend, separadas por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Datos de ejemplo para la demo (categorias, productos, vendedor y cliente). Poner false para desactivar
app.demo-data.enabled=${DEMO_DATA:true}

# Monitoreo (ping / heartbeat): GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
