# Perfil MySQL: se activa con  --spring.profiles.active=mysql  (o SPRING_PROFILES_ACTIVE=mysql)
# Las credenciales vienen de variables de entorno (no se guardan en el repositorio).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nutrivida}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:nutrivida}
spring.datasource.password=${DB_PASSWORD:nutrivida}

# Hibernate crea/actualiza las tablas solas (no hay migraciones Flyway en este proyecto)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

# En produccion no se expone la consola H2
spring.h2.console.enabled=false
