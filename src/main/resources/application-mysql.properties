# Perfil AWS RDS MySQL: se activa con SPRING_PROFILES_ACTIVE=mysql.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${AWS_DB_HOST}:${AWS_DB_PORT:3306}/${AWS_DB_NAME}?sslMode=${AWS_DB_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=${AWS_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&connectionTimeZone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${AWS_DB_USER}
spring.datasource.password=${AWS_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate crea/actualiza las tablas; SQL visible durante el desarrollo.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# En MySQL no se expone la consola H2.
spring.h2.console.enabled=false
